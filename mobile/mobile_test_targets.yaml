# ----------------------------------------------------------------------------
  - id: MU-401
    name: channel configuration constants
    requirement: locked constants (transport)
    tier: *jvm
    method: >
      unit; the internal transport constants the production builder reads
      (seam S3) are pinned exactly. METHOD CORRECTED 2026-08-14
      pre-measurement: builder-parameter capture is not observable
      (ManagedChannelBuilder exposes no getters) and the in-process
      transport enforces neither size caps nor keepalive — so the pinned
      constants + the single builder call site that consumes them are the
      testable surface off-device; plaintext/withoutCalls remain
      source-pinned only.
    oracle: source constants (GrpcModule.channelInstance)
    gate: PORT 50051; MAX_INBOUND_BYTES 16777216; KEEPALIVE_TIME 30 s;
      KEEPALIVE_TIMEOUT 10 s — exact; plaintext + keepAliveWithoutCalls
      true stated as source-pinned, not measured

  - id: MU-402
