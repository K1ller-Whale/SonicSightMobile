      threshold

  - id: MU-202
    name: ring capacity and drop-oldest overflow
    requirement: REC-1 (capacity row)
    tier: *jvm
    method: unit; fill beyond capacity; assert oldest bytes gone, newest kept;
      chunk > whole buffer keeps tail only (JitterBuffer.kt:124-141)
    oracle: ring arithmetic
    gate: maxBytes == 33075 @ 11025, 66150 @ 22050; retained bytes exactly
      the newest maxBytes

  - id: MU-203
    name: drain chunk size and pacing contract
    requirement: playback continuity
    tier: *jvm
    method: unit; fake blocking sink records write sizes
    oracle: drainChunkBytes = 512 (256 samples)
    gate: all steady-state writes exactly 512 B; pacing derives from sink
      blocking (documented, not timed)

  - id: MU-204
    name: underrun inserts silence and counts
    requirement: playback continuity
    tier: *jvm
    method: unit; drain with empty ring
    oracle: silenceChunk write (JitterBuffer.kt:237-241)
    gate: 512 B of zeros written; underrun counter increments; no exception

  - id: MU-205
    name: adaptive prebuffer step and ceiling
    requirement: REC-1
    tier: *jvm
    method: unit; force 3, 6, ... consecutive underruns
    oracle: +50 ms per 3 consecutive, ceiling 500 ms; takes effect next
      start() only (initialBufferBytes snapshot at drainLoop entry,
      JitterBuffer.kt:169,243-247)
    gate: as stated, including the next-start-only property (characterization)

  - id: MU-206
    name: partial drain zero-pads to full write (characterization)
    requirement: defect-candidate
    tier: *jvm
    method: unit; ring holds < 512 B; full 512-B write with zero tail
