    oracle: current behaviour (buffer has no sequence awareness; gap
      handling lives in MainViewModel — MU-703)
    gate: characterization

  - id: MU-208
    name: burst handling
    requirement: robustness
    tier: *jvm
    method: unit; N chunks written at once, N*size > capacity
    oracle: same drop-oldest arithmetic as MU-202
    gate: buffer holds exactly newest maxBytes; no exception. (Sustained
      overproduction runs: DEFERRED)

  - id: MU-209
    name: byte<->ms math at both rates
    requirement: REC-1; off-by-2x guard
    tier: *jvm
    method: unit; bufferLevelMs at known fill for 11025 and 22050
    oracle: bytes*1000/(rate*2)
    gate: exact; the 2x-wrong-rate construction (default 11025 used at
