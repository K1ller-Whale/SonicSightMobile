    requirement: locked constant (16 MB cap)
    tier: *jvm
    method: >
      METHOD CORRECTED 2026-08-14 pre-measurement: the in-process transport
      passes messages by reference without serialization, so inbound size
      limits are NOT enforced there and the RESOURCE_EXHAUSTED effect is
      not producible off-device. The cap's configured value is pinned in
      MU-401; the effect is NOT MEASURED at unit level (would require a
      socket transport, banned in JVM tests, or a device run).
    oracle: none at unit level (see MU-401 for the configuration pin)
    gate: recorded as not measured at unit level — no unit gate

