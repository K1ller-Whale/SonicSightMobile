# ----------------------------------------------------------------------------
# MI-DEV — Device preprocessing probes (Tier 2; the only tier proving capture)
# ----------------------------------------------------------------------------
  - id: MI-DEV-002
    name: frame differential oracle on hardware
    requirement: defect-discovery / demo-hardware verification
    tier: *device
    method: instrumented; CameraX ImageAnalysis 1280x720, ~10 frames; record
      per-plane rowStride/pixelStride/rotation; convert each frame via app
      path AND via independent stride-honouring reference; per-pixel diff;
      then run real chain (rotate/split/256/crop224/JPEG90) and record dims,
      JPEG bytes, per-channel mean/std; measure delivered cadence over 10 s
      and the >=125 ms gate
    oracle: reference conversion (test source set, independent of app code)
    gate: >
      per-channel max abs diff <= 16 AND per-channel mean abs diff <= 2.
      Derived BEFORE any device run (2026-08-13) — the first observation is
      contaminated by the defect under test, so the tolerance must come from
      arithmetic, not observation. Derivation: (a) integer BT.601 YUV->RGB
      rounding differences between two correct implementations: <= 2 LSB per
      channel; (b) JPEG q100 4:2:0 round-trip (chroma grid already 4:2:0 in
      YUV_420_888, no further subsampling loss): near-unity quantization
      tables round each DCT coefficient by <= 0.5 step, worst-case spatial
      accumulation <= (1/8)*sum(0.5*q) = 4 LSB luma; chroma error <= 4 LSB
      through conversion coefficients (max |coef| ~ 1.772 for B<-U) <= 8 LSB
      in RGB; (c) total worst case 2+4+8 = 14, gated at 16 for power-of-two
      headroom. Mean: DCT rounding noise is zero-mean, per-sample RMS
      <= sqrt(64/12)/8 ~ 0.29 LSB luma, ~1 LSB through chroma — gated at 2.
      The stride-defect signature sits far outside both bounds (whole-pixel
      row/column displacement, typical diffs 50+ on a large pixel fraction),
      so pass/fail separates cleanly. Max, mean and fraction-over-16 are
      reported regardless of verdict; first-run numbers reported to owner
      before any fix decision (sequence in MOBILE_TEST_PLAN.md,
      "Documented-defect pins" section). Output: JSON per device.

  - id: MI-DEV-003
    name: audio preprocessing determinism + capability on hardware
    requirement: portability evidence (why capture 44100 + decimate)
    tier: *device
    method: instrumented; (a) determinism — committed synthetic PCM through
      AudioDecimator on device, byte-compare vs JVM golden; (b) capability —
      {44100,22050,11025} x {MONO,STEREO} x {PCM_16BIT,FLOAT}:
      getMinBufferSize + AudioRecord init success; 2 s real capture at
      44100/mono/16 -> effective rate from sample count/elapsed; AudioTrack
      min buffers; dual panned playback survival
    oracle: (a) JVM golden (exact); (b) inventory — no gate, evidence table
    gate: (a) byte-identical; (b) no gate — recorded facts; effective-rate
      gate TBD-after-first-observation. Output states explicitly the
      connection - low rates not universally supported is the reason the
      app captures at 44100 and decimates in software.

