# ============================================================================
# mobile_test_targets.yaml — SonicSightMobile verification targets
# ============================================================================
# Written BEFORE any measurement, per the project evidence discipline.
# This file is the SINGLE SOURCE for gates (mirror of the backend's
# nfr/nfr_targets.yaml convention). MOBILE_TEST_PLAN.md references ids here;
# it never restates a gate value.
#
# Rules:
#   1. Targets precede measurement and are never softened afterwards to make
#      a result pass. Corrections are declared in `reconciliations:` with a
#      reason — never silently edited.
#   2. Result labels (used in MOBILE_TEST_REPORT.md, never here):
#      implemented+verified | implemented | partial | not-met.
#   3. What was not measured is stated as not measured. No estimated numbers.
#   4. Every measured number carries its conditions (device, API level,
#      build type, run count).
#   5. A gate not derivable from the locked constants is written as
#      `TBD-after-first-observation` and is declared (dated) when set.

meta:
  written: 2026-08-13
  repo: SonicSightMobile
  branch: test/mobile-suite
  baseline_commit: c66cbf8  # was 56a02a5 before the 2026-08-13 history rewrite (commit-message cleanup; trees identical)
  build_versions:
    agp: 8.13.2
    gradle: "8.13"
    kotlin: 2.0.21
    coroutines: 1.7.3
    grpc: 1.62.2
    grpc_kotlin: 1.4.1
    protobuf: 3.25.3 (lite runtime)
    minSdk: 28
    targetSdk: 36
    compileSdk: 36

conditions:
  jvm: &jvm >
    JVM unit test (testDebugUnitTest), Windows 11 host, Gradle 8.13 /
    AGP 8.13.2, JVM target 11. Deterministic: runTest +
    StandardTestDispatcher virtual time, injected clocks, seeded RNG,
    no real sockets (in-process gRPC), no Thread.sleep.
  robolectric: &robo >
    JVM unit test under Robolectric at a single SDK level (multi-API matrix
    is DEFERRED — Robolectric here is a unit-test enabler for
    android.graphics / lifecycle, not a device tier). SDK level recorded in
    the report; must be within the installed Robolectric version's support
    matrix.
  device: &device >
    Instrumented test on physically connected hardware. Device model, API
    level, build type and run count recorded in the probe's JSON output and
    in DEVICE_MATRIX.md. Devices not run are absent from the table, never
    estimated.

# ----------------------------------------------------------------------------
# Reconciliations — declared 2026-08-13, before any measurement was taken.
# Reason common to all: the original brief row was written from a compressed
# project summary rather than from source. Source is authoritative.
# ----------------------------------------------------------------------------
reconciliations:
  - id: REC-1
    row: jitter-buffer
    was: "prebuffer 1.5 s = 33075 B"
    now: >
      Two distinct gates. Capacity: maxBufferMs=1500 rate-scaled to bytes —
      33075 B @ 11025 Hz, 66150 B @ 22050 Hz (JitterBuffer.kt:45). Prebuffer
      (playback-start): initialBufferMs=200 ms, adaptive +50 ms per 3
      consecutive underruns to a 500 ms ceiling (JitterBuffer.kt:29,37-41).
      Independently verified 2026-08-13.
  - id: REC-2
    row: heatmap-overlay
    was: "overlay 672x336 as integer x12 of 56"
    now: >
      Each heatmap is scaled to a HARD-CODED 336x336 target regardless of
      inferred side (Bitmap.createScaledBitmap(bitmap, 336, 336, true),
      MaskProcessor.kt:140 — "x6" is only the incidental ratio for the
      56-side case). Halves (heatmapCount==2) stitches two into 672x336
      (MainViewModel.kt:394-399). Speech (1 map) renders 336x336. Pixel
      mode is the one true multiplier path: grid*24 = 336x336 for 14x14
      (MaskProcessor.kt:190). "x12 of 56" framing dropped.
  - id: REC-3
    row: stale-proto-comment
    was: "sonicsight.proto claims 21000 Hz for the speech wire"
    now: >
      Obsolete. Proto states 22050 Hz on the wire with 21000 Hz noted as the
      engine's internal rate only (sonicsight.proto:158, 199-204). MU-802
      still pins 22050; MU-801 pins the observed cross-repo SHA-256.
  - id: REC-4
    row: result-cadence
    was: "client asserts halves 8 results/s, speech 4 results/s"
    now: >
      4/s (250 ms hop) is a SERVER cadence; no client constant exists. Client
      sends 125 ms audio blocks on both profiles (streamRate/8 —
      MainActivity.kt:982). Receive side assumes no cadence: 500 ms
      degradation log + 1250-sample gap-fill fallback
      (MainViewModel.kt:294,307). Send side tested as-is; receive side
      characterized as-is.
  - id: REC-5
    row: viewmodel-state
    was: "states idle/permissions/connecting/streaming/error/stopped;
      SavedStateHandle persists server address; host:port validated"
    now: >
      Real state set: Idle/Processing/Uploading/Streaming/Error/
      NavigationReady (MainViewModel.kt:25-36). Persistence is
      SharedPreferences via GrpcModule, not SavedStateHandle. No server
      address validation exists (MainActivity.kt:468-486) — recorded as a
      product gap (see D-M ledger), not a contradiction: the report claims
      only that the host is user-set and persisted.
  - id: REC-5-addendum
    row: server-address-validation
    was: "REC-5 stated no server-address validation exists"
    now: >
      Refined 2026-08-14 pre-measurement: GrpcModule.setHost DOES trim and
      reject empty/blank input (GrpcModule.kt); what does not exist is any
      FORMAT validation (hostname/IP/port syntax). MU-707 characterizes
      exactly that split.
  - id: REC-6
    row: FR-033
    was: "mobile pins speech burst cap 0.75 s vs designed 1.5 s"
    now: >
      Reattributed to the backend, with an anchor: exhaustive mobile source
      inspection + grep found no sample-valued burst cap client-side (the
      mobile jitter buffer rate-scales capacity correctly at both wire
      rates), and the constant was located server-side —
      SAFE_DRAIN_SAMPLES = int(AUD_RATE * 1.5) = 16537 samples
      (SonicSightBackend/src/grpc_server.py:354, config.py:14 AUD_RATE =
      11025), fixed across branches, = 0.75 s at the 22050 Hz speech
      output. Removed from the mobile pinning set entirely; recorded as
      D-M-1 in docs/MOBILE_DEFECTS.md.

removed:
  - id: FR-033-pin
    reason: see REC-6. No test, no @Ignore'd intent test, nothing in app/src/test.

# ----------------------------------------------------------------------------
# MU-1xx — Audio capture & decimation (AudioDecimator, ModelProfile)
# ----------------------------------------------------------------------------
targets:
  - id: MU-101
    name: FIR impulse response matches independent golden
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; impulse through process(); compare vs NumPy golden
    oracle: >
      committed golden vectors (app/src/test/resources/goldens), generated
      by an independent NumPy reimplementation of the spec (float64,
      replicates the truncating quantizer `(acc*32768).toInt()`). The
      generator itself is a LOCAL, UNTRACKED tool (mobile/tools/,
      gitignored per owner instruction 2026-08-13); regenerating reproduces
      the committed vectors byte-identically (verified 2026-08-13). The
      committed vectors are the oracle artifact of record.
    gate: >
      max abs error <= 2 LSB (PCM16). Justification: 121-term float32
      accumulation worst-case ~121*eps*fullscale ≈ 0.5 LSB, plus 1 LSB
      truncation asymmetry; 2 LSB bounds both with margin.

  - id: MU-102
    name: passband tone preserved (both profiles)
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; 1 kHz sine @ halves profile, 2 kHz @ speech; steady-state
      amplitude after group-delay settle
    oracle: analytic amplitude of the input sine
    gate: >
      |passband deviation| <= 0.1 dB. DECLARED 2026-08-13 from first
      observation (halves 1 kHz: +0.0114 dB; speech 2 kHz: -0.0027 dB;
      conditions per `conditions.jvm`), set at ~10x the observed deviation.
      Declared at first setting per rule 5, not retro-fitted.

  - id: MU-103
    name: stopband attenuation above output Nyquist
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; 7 kHz tone @ halves (>5512.5 Hz), 12 kHz @ speech
      (>11025 Hz); residual RMS after settle
    oracle: analytic input RMS
    gate: >
      attenuation <= -70 dB (halves, 7 kHz tone) and <= -75 dB (speech,
      12 kHz tone). DECLARED 2026-08-13 from first observation — observed
      -74.53 dB and -80.45 dB respectively (conditions per
      `conditions.jvm`); floors set ~5 dB above observed. The observed
      values are stated, not wished (brief rule).

  - id: MU-104
    name: DC gain unity
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; constant mid-scale input (16384) long enough to flush
      group delay; compare output plateau
    oracle: taps normalized to unity DC by construction (AudioDecimator.kt:57-58)
    gate: plateau within +/-2 LSB of input value

  - id: MU-105
    name: linear-phase group delay = 60 samples at input rate
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; impulse position of output peak
    oracle: (nTaps-1)/2 = 60 for 121 taps
    gate: >
      impulse response symmetric about input-sample delay 60 with its peak
      there. Corrected 2026-08-13 PRE-measurement (constant unchanged,
      method fixed): decimated sampling at /4 emits at input indices
      i ≡ 3 (mod 4), which never lands on 60, so a single-run argmax cannot
      see the peak; the test reconstructs the full 121-point response from
      4 (resp. 2) zero-prefixed runs interleaved, then asserts peak at 60
      and y[60+k] == y[60-k]

  - id: MU-106
    name: filter state continuity across blocks
    requirement: FR-audio-decimation (highest-risk item)
    tier: *jvm
    method: unit; one long buffer in a single call vs identical data split
      into 5512-sample blocks, and into adversarial splits (1, 3, 5511,
      non-multiples of 4); seeded-random signal
    oracle: single-call output
    gate: outputs byte-identical (zero tolerance)

  - id: MU-107
    name: block arithmetic halves — 5512 in, 1378 out
    requirement: locked constant (5512-sample / 125 ms block)
    tier: *jvm
    method: unit; k blocks of 11024 bytes through /4 path
    oracle: phase-counter arithmetic — floor(totalSamples/4)
    gate: exactly 1378*k output samples (2756 bytes per block)

  - id: MU-108
    name: speech path /2 — 5512 in, 2756 out @ 22050
    requirement: locked constant (wire rate 22050)
    tier: *jvm
    method: unit; same battery as MU-107 with factor 2, cutoff 10 kHz
    oracle: floor(totalSamples/2)
    gate: exactly 2756*k output samples; profile constant streamRate == 22050

  - id: MU-109
    name: zero-length input
    requirement: robustness
    tier: *jvm
    method: unit; process() with 0 bytes and with 1 byte (inSamples==0)
    oracle: code contract — returns 0, no state mutation
    gate: 0 bytes out; subsequent output identical to a run without the
      empty call

  - id: MU-110
    name: remainder carry for non-multiple input sizes
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; totals identical, chunkings different (e.g. 5+3 vs 8
      samples); phase persistence across calls
    oracle: single-call output
    gate: byte-identical; total out == floor(totalIn/factor)

  - id: MU-111
    name: odd trailing byte silently discarded (characterization)
    requirement: defect-candidate
    tier: *jvm
    method: unit; lengthBytes odd — document that the trailing byte is
      dropped with no carry (AudioDecimator.kt:74)
    oracle: current behaviour
    gate: characterization — asserts today's behaviour; candidate D-M entry

  - id: MU-112
    name: undersized output buffer drops samples silently (characterization)
    requirement: defect-candidate
    tier: *jvm
    method: unit; output array smaller than maxOutputBytes; samples skipped
      while phase/history advance (AudioDecimator.kt:103-107)
    oracle: current behaviour
    gate: characterization — asserts today's behaviour; candidate D-M entry

  - id: MU-113
    name: PCM16 little-endian layout both directions
    requirement: locked constant (PCM16-LE wire)
    tier: *jvm
    method: unit; known sample values; assert byte order in and out
      (AudioDecimator.kt:84-88, 104-105)
    oracle: hand-computed byte pairs
    gate: exact bytes

  - id: MU-114
    name: sample/byte/duration conversions, both profiles
    requirement: locked constants
    tier: *jvm
    method: unit; pure arithmetic pinned — 1378 samples = 2756 B ≈ 124.99 ms
      @ 11025; 2756 samples = 5512 B ≈ 124.99 ms @ 22050; capture block
      5512 samples = 11024 B = 125.0 ms - 11.3 us @ 44100 (5512 vs 5512.5
      truncation stated)
    oracle: arithmetic
    gate: exact values as stated

  - id: MU-115
    name: decimator constructor invariants
    requirement: FR-audio-decimation
    tier: *jvm
    method: unit; numTaps=120 -> effective 121; factor 0 and cutoff >=
      Nyquist -> IllegalArgumentException (AudioDecimator.kt:38-42)
    oracle: code contract
    gate: as stated

# ----------------------------------------------------------------------------
# MU-2xx — Jitter buffer (JitterBuffer via PcmSink seam)
# ----------------------------------------------------------------------------
  - id: MU-201
    name: prebuffer gate before playback
    requirement: REC-1 (prebuffer row)
    tier: *jvm
    method: unit; PcmSink fake; write below/at threshold
